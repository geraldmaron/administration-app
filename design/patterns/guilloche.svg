<!-- Guilloché rosette over an interlaced wave band: security-print linework drawn for The Administration, not traced from any real note, certificate or seal. Shipped as a CSS mask tile in packages/design/src/patterns.css, so the stroke color is irrelevant; only its alpha prints. -->
<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'>
<defs>
<ellipse id='e' cx='120' cy='120' rx='104' ry='34'/>
<g id='e2'><use href='#e'/><use href='#e' transform='rotate(10 120 120)'/></g>
<g id='e6'><use href='#e2'/><use href='#e2' transform='rotate(20 120 120)'/><use href='#e2' transform='rotate(40 120 120)'/></g>
<circle id='c' cx='166' cy='120' r='46'/>
<g id='c3'><use href='#c'/><use href='#c' transform='rotate(20 120 120)'/><use href='#c' transform='rotate(40 120 120)'/></g>
<path id='w' d='M0 0C5 -8 15 -8 20 0S35 8 40 0S55 -8 60 0S75 8 80 0S95 -8 100 0S115 8 120 0S135 -8 140 0S155 8 160 0S175 -8 180 0S195 8 200 0S215 -8 220 0S235 8 240 0'/>
<g id='b'><use href='#w'/><use href='#w' transform='scale(1 -1)'/></g>
